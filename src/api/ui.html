<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocIQ — Medical Document Processor</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e1e4ed;
      --text-dim: #8b8fa3;
      --accent: #6c8aff;
      --accent-hover: #8da4ff;
      --success: #4ade80;
      --error: #f87171;
      --warning: #fbbf24;
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    header svg { flex-shrink: 0; }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    header span {
      font-size: 13px;
      color: var(--text-dim);
      margin-left: auto;
    }

    .container {
      display: grid;
      grid-template-columns: 380px 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left panel ─────────────────────── */
    .panel-left {
      border-right: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(108, 138, 255, 0.06);
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-zone p { color: var(--text-dim); font-size: 14px; line-height: 1.6; }
    .drop-zone p strong { color: var(--accent); }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
    }

    .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .size { color: var(--text-dim); font-size: 12px; flex-shrink: 0; }
    .file-item .remove {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 4px;
    }
    .file-item .remove:hover { color: var(--error); background: rgba(248,113,113,0.1); }

    .controls { display: flex; flex-direction: column; gap: 12px; }

    .format-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .format-row select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .btn-process {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-process:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-process:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Right panel (output) ───────────── */
    .panel-right {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .output-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
    }

    .output-header .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .badge-ok { background: rgba(74,222,128,0.15); color: var(--success); }
    .badge-err { background: rgba(248,113,113,0.15); color: var(--error); }
    .badge-idle { background: rgba(139,143,163,0.15); color: var(--text-dim); }

    .output-body {
      flex: 1;
      overflow: auto;
      padding: 20px 24px;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .placeholder svg { opacity: 0.3; }

    pre.json-output {
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 12.5px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      tab-size: 2;
    }

    /* JSON syntax highlighting */
    .json-key { color: #7dd3fc; }
    .json-string { color: #86efac; }
    .json-number { color: #c4b5fd; }
    .json-bool { color: #fbbf24; }
    .json-null { color: #f87171; font-style: italic; }

    /* ── Result tabs ───────────────────── */
    .result-tabs {
      display: flex;
      gap: 4px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .result-tab {
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .result-tab:hover { color: var(--text); }
    .result-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Responsive ─────────────────────── */
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .panel-left { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M9 12h6m-3-3v6m-7 4h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
  </svg>
  <h1>DocIQ</h1>
  <span>Medical Document Processor</span>
</header>

<div class="container">
  <!-- Left panel -->
  <div class="panel-left">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" multiple accept=".pdf,.png,.jpg,.jpeg" />
      <p><strong>Click to browse</strong> or drag &amp; drop<br/>PDF, PNG, JPG</p>
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="controls">
      <div class="format-row">
        <label for="formatSelect">Output format:</label>
        <select id="formatSelect">
          <option value="json" selected>JSON</option>
          <option value="fhir">FHIR</option>
        </select>
      </div>
      <button class="btn-process" id="processBtn" disabled>
        <span class="spinner" id="spinner"></span>
        <span id="btnLabel">Process Files</span>
      </button>
    </div>
  </div>

  <!-- Right panel -->
  <div class="panel-right">
    <div class="output-header">
      <span>Output</span>
      <span class="badge badge-idle" id="statusBadge">Waiting</span>
    </div>
    <div class="result-tabs" id="resultTabs" style="display:none"></div>
    <div class="output-body" id="outputBody">
      <div class="placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>Upload files and click Process to see results here</span>
      </div>
    </div>
  </div>
</div>

<script>
  const fileInput = document.getElementById("fileInput");
  const dropZone  = document.getElementById("dropZone");
  const fileList  = document.getElementById("fileList");
  const processBtn = document.getElementById("processBtn");
  const btnLabel  = document.getElementById("btnLabel");
  const spinner   = document.getElementById("spinner");
  const outputBody = document.getElementById("outputBody");
  const statusBadge = document.getElementById("statusBadge");
  const resultTabs = document.getElementById("resultTabs");
  const formatSelect = document.getElementById("formatSelect");

  let selectedFiles = [];
  let responseData = null;

  // ── Drag & drop ──────────────────────
  dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    addFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });

  function addFiles(fileListObj) {
    for (const f of fileListObj) {
      if (!selectedFiles.find(s => s.name === f.name && s.size === f.size)) {
        selectedFiles.push(f);
      }
    }
    renderFileList();
  }

  function removeFile(idx) {
    selectedFiles.splice(idx, 1);
    renderFileList();
  }

  function renderFileList() {
    fileList.innerHTML = selectedFiles.map((f, i) => `
      <div class="file-item">
        <span class="name">${escHtml(f.name)}</span>
        <span class="size">${formatSize(f.size)}</span>
        <button class="remove" onclick="removeFile(${i})" title="Remove">&times;</button>
      </div>
    `).join("");
    processBtn.disabled = selectedFiles.length === 0;
  }

  // ── Process ──────────────────────────
  processBtn.addEventListener("click", async () => {
    if (selectedFiles.length === 0) return;

    processBtn.disabled = true;
    spinner.style.display = "block";
    btnLabel.textContent = "Processing…";
    statusBadge.className = "badge badge-idle";
    statusBadge.textContent = "Processing…";

    const form = new FormData();
    selectedFiles.forEach(f => form.append("files", f));

    try {
      const res = await fetch(`/process?format=${formatSelect.value}`, { method: "POST", body: form });
      responseData = await res.json();

      if (!res.ok) {
        statusBadge.className = "badge badge-err";
        statusBadge.textContent = `Error ${res.status}`;
        outputBody.innerHTML = `<pre class="json-output">${highlightJSON(JSON.stringify(responseData, null, 2))}</pre>`;
        resultTabs.style.display = "none";
        return;
      }

      const results = responseData.results || [];
      const okCount = results.filter(r => r.status === "ok").length;
      const errCount = results.length - okCount;

      if (errCount === 0) {
        statusBadge.className = "badge badge-ok";
        statusBadge.textContent = `${okCount} file${okCount !== 1 ? "s" : ""} processed`;
      } else {
        statusBadge.className = "badge badge-err";
        statusBadge.textContent = `${okCount} ok, ${errCount} error${errCount !== 1 ? "s" : ""}`;
      }

      if (results.length > 1) {
        resultTabs.style.display = "flex";
        resultTabs.innerHTML = results.map((r, i) => `
          <button class="result-tab ${i === 0 ? 'active' : ''}" data-idx="${i}">
            ${escHtml(r.file)}
          </button>
        `).join("");
        resultTabs.querySelectorAll(".result-tab").forEach(tab => {
          tab.addEventListener("click", () => {
            resultTabs.querySelectorAll(".result-tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            showResult(parseInt(tab.dataset.idx));
          });
        });
      } else {
        resultTabs.style.display = "none";
      }

      showResult(0);

    } catch (err) {
      statusBadge.className = "badge badge-err";
      statusBadge.textContent = "Network Error";
      outputBody.innerHTML = `<pre class="json-output" style="color:var(--error)">${escHtml(err.message)}</pre>`;
      resultTabs.style.display = "none";
    } finally {
      spinner.style.display = "none";
      btnLabel.textContent = "Process Files";
      processBtn.disabled = selectedFiles.length === 0;
    }
  });

  function showResult(idx) {
    const r = responseData.results[idx];

    // Multi-page PDF: show page tabs and per-page results
    if (r.pages && r.pages.length > 1) {
      let html = `<div style="margin-bottom:16px;color:var(--text-dim);font-size:13px;">
        ${r.page_count} pages detected &mdash; each page processed independently
      </div>`;
      html += `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;">`;
      r.pages.forEach((p, i) => {
        const color = p.extracted_data ? 'var(--success)' : (p.status === 'skipped' ? 'var(--text-dim)' : 'var(--warning)');
        html += `<button onclick="showPage(${idx},${i})" class="result-tab"
          style="border:1px solid ${color};color:${color};border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;background:none;"
          id="pageTab_${i}">
          P${p.page} &middot; ${p.document_type || 'unknown'}
        </button>`;
      });
      html += `</div>`;
      html += `<div id="pageContent"></div>`;
      outputBody.innerHTML = html;
      showPage(idx, 0);
    } else {
      const pretty = JSON.stringify(r, null, 2);
      outputBody.innerHTML = `<pre class="json-output">${highlightJSON(pretty)}</pre>`;
    }
  }

  function showPage(resultIdx, pageIdx) {
    const p = responseData.results[resultIdx].pages[pageIdx];
    const el = document.getElementById("pageContent");
    if (el) {
      el.innerHTML = `<pre class="json-output">${highlightJSON(JSON.stringify(p, null, 2))}</pre>`;
    }
    // Highlight active page tab
    document.querySelectorAll('[id^="pageTab_"]').forEach((t, i) => {
      t.style.fontWeight = i === pageIdx ? '700' : '400';
      t.style.background = i === pageIdx ? 'rgba(108,138,255,0.12)' : 'none';
    });
  }

  // ── JSON syntax highlighter ──────────
  function highlightJSON(str) {
    return str.replace(
      /("(?:\\.|[^"\\])*")\s*:/g,
      (m, key) => `<span class="json-key">${escHtml(key)}</span>:`
    ).replace(
      /:\s*("(?:\\.|[^"\\])*")/g,
      (m, val) => ': <span class="json-string">' + escHtml(val) + '</span>'
    ).replace(
      /:\s*(-?\d+\.?\d*(?:[eE][+-]?\d+)?)/g,
      (m, num) => ': <span class="json-number">' + num + '</span>'
    ).replace(
      /:\s*(true|false)/g,
      (m, b) => ': <span class="json-bool">' + b + '</span>'
    ).replace(
      /:\s*(null)/g,
      ': <span class="json-null">null</span>'
    );
  }

  // ── Helpers ──────────────────────────
  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1048576).toFixed(1) + " MB";
  }
</script>
</body>
</html>
